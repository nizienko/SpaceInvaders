name: Prepare Draft Release
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  prepare-draft-release:
    name: Prepare Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Set environment variables
      - name: Export Properties
        id: properties
        shell: bash
        run: |
          PROPERTIES="$(./gradlew properties --console=plain -q)"
          VERSION="$(echo "$PROPERTIES" | grep "^version:" | cut -f2- -d ' ')"        
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # Remove old release drafts by using the curl request for the available releases with draft flag
      - name: Remove Old Release Drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft) | .id' \
            | while read -r release_id; do
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
              done
      # Create new release draft - which is not publicly visible and requires manual acceptance
      - name: Create Release Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.properties.outputs.version }}" \
            --title "v${{ steps.properties.outputs.version }}" \
            --draft \
            --generate-notes
