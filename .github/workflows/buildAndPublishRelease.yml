name: Build and publish plugin
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build-and-publish:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the plugin
        run: ./gradlew :buildPlugin
      - name: Save the plugin
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: SpaceInvaders-plugin
          path: |
            build/distributions/SpaceInvaders-*.zip
      - name: Upload the plugin to the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/distributions/SpaceInvaders-*.zip --clobber
